name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"
      # Exercise the rg backend; the suite's PATH test still covers the walk.
      - run: sudo apt-get install -y ripgrep
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit
